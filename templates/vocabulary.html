<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语单词本 - CET4/CET6</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" type="image/svg+xml">
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .level-selector {
            display: flex;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            border-radius: 0;
            overflow: hidden;
        }

        .level-btn {
            flex: 1;
            padding: 20px;
            background: #f5f5f5;
            border: none;
            border-right: 1px solid #ddd;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #666;
            position: relative;
            margin: 0;
        }

        .level-btn:last-child {
            border-right: none;
        }

        .level-btn.active {
            background: #4CAF50;
            color: white;
            z-index: 1;
        }

        .level-btn:hover:not(.active) {
            background: #e8f5e8;
            color: #4CAF50;
        }

        .level-btn.active:hover {
            background: #45a049;
        }

        .word-container {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
        }

        .word-list {
            display: block;
        }

        .word-card {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #4CAF50;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .word-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background: #f0f8f0;
        }

        .word-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .word {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .level-badge {
            background: #4CAF50;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .word-badges {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .source-badge {
            background: rgba(33, 150, 243, 0.1);
            color: #1976D2;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.8em;
            border: 1px solid rgba(33, 150, 243, 0.3);
            cursor: help;
            transition: all 0.3s ease;
        }

        .source-badge:hover {
            background: rgba(33, 150, 243, 0.2);
            transform: scale(1.1);
        }

        .translation {
            font-size: 1.3em;
            font-weight: bold;
            color: #2E7D32;
            margin-bottom: 8px;
            border-left: 3px solid #4CAF50;
            padding-left: 10px;
        }

        .meaning {
            font-size: 1.1em;
            color: #666;
            line-height: 1.4;
        }

        .refresh-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: white;
            color: #4CAF50;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
        }

        .api-status {
            text-align: center;
            padding: 10px;
            background: linear-gradient(45deg, #e8f5e8, #f0f8f0);
            color: #4CAF50;
            font-size: 0.9em;
            border-bottom: 1px solid #ddd;
            transition: all 0.3s ease;
        }

        .api-status.loading {
            background: linear-gradient(45deg, #fff3cd, #ffeaa7);
            color: #856404;
            animation: pulse 2s infinite;
        }

        .api-status.ready {
            background: linear-gradient(45deg, #d4edda, #c3e6cb);
            color: #155724;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* 搜索功能样式 */
        .search-section {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .search-btn, .clear-search-btn {
            padding: 12px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-btn:hover, .clear-search-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .clear-search-btn {
            background: #f44336;
        }

        .clear-search-btn:hover {
            background: #d32f2f;
        }

        .search-filters {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .filter-label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-weight: 500;
        }

        .filter-label input[type="radio"] {
            margin: 0;
        }

        .search-tip {
            text-align: center;
            margin-top: 10px;
            padding: 8px 12px;
            background: #e8f5e8;
            color: #2E7D32;
            border-radius: 15px;
            font-size: 0.9rem;
            border-left: 3px solid #4CAF50;
        }

        /* 搜索结果独立区域 - 简化为标签页内容 */
        .search-results-section {
            display: none;
        }

        .search-results-container {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
        }

        .search-results-info {
            text-align: center;
            padding: 15px;
            background: #e3f2fd;
            color: #1976D2;
            font-weight: bold;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 10px;
        }

        .pagination button {
            padding: 8px 16px;
            border: 1px solid #4CAF50;
            background: white;
            color: #4CAF50;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination button:hover {
            background: #4CAF50;
            color: white;
        }

        .pagination button.active {
            background: #4CAF50;
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .page-info {
            margin: 0 15px;
            color: #666;
            font-weight: bold;
        }

        .word-count {
            text-align: center;
            padding: 15px;
            background: #f0f8f0;
            color: #4CAF50;
            font-weight: bold;
            font-size: 1.1em;
        }

        /* 滚动条样式 */
        .word-container::-webkit-scrollbar {
            width: 8px;
        }

        .word-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .word-container::-webkit-scrollbar-thumb {
            background: #4CAF50;
            border-radius: 10px;
        }

        .word-container::-webkit-scrollbar-thumb:hover {
            background: #45a049;
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .level-btn {
                padding: 15px;
                font-size: 1em;
            }
            
            .word-container {
                height: 400px;
                padding: 15px;
            }
            
            .word-card {
                padding: 15px;
            }
            
            .word {
                font-size: 1.3em;
            }
        }

        /* 回到顶部按钮 */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: rgba(76, 175, 80, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            z-index: 9999;
        }

        .back-to-top.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .back-to-top:hover {
            background: rgba(76, 175, 80, 1);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .back-to-top:active {
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            .back-to-top {
                bottom: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <a href="/" style="color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; transition: all 0.3s ease;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">
                    ← 返回主页
                </a>
                <a href="/ai/" style="color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; transition: all 0.3s ease;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">
                    🤖 AI助手
                </a>
            </div>
            <h1>📚 英语单词本</h1>
            <p>CET-4 & CET-6 词汇学习 - 实时API数据</p>
            <button class="refresh-btn" onclick="refreshData()">🔄 刷新数据</button>
        </div>

        <div class="api-status" id="apiStatus">
            📚 智能词汇学习平台 | 本地词库: CET-4({{ local_cet4 }}词) + CET-6({{ local_cet6 }}词) | 🚀 联合搜索引擎启动中...
        </div>

        <!-- 搜索功能 -->
        <div class="search-section">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="搜索单词（支持中英文、数字）..." />
                <button class="search-btn" onclick="performSearch()">🔍</button>
                <button class="clear-search-btn" onclick="clearSearch()" style="display: none;">✖️</button>
            </div>
            <div class="search-filters">
                <label class="filter-label">
                    <input type="radio" name="searchLevel" value="all" checked> 全部
                </label>
                <label class="filter-label">
                    <input type="radio" name="searchLevel" value="cet4"> 仅CET-4
                </label>
                <label class="filter-label">
                    <input type="radio" name="searchLevel" value="cet6"> 仅CET-6
                </label>
            </div>
            <div class="search-tip">
                💡 智能搜索引擎：本地精准匹配优先 + 异步API补充 | 支持数字搜索（如"1"、"15"、"一"、"十五"、"百"、"第三"）| 中英文混合搜索 | ⚡ 避免长时间等待
            </div>
        </div>

        <div class="level-selector" id="levelSelector">
            <button class="level-btn" id="searchTab" onclick="showSearchResults()" style="display: none;">🔍 搜索结果</button>
            <button class="level-btn active" onclick="showLevel('cet4')">CET-4 词汇</button>
            <button class="level-btn" onclick="showLevel('cet6')">CET-6 词汇</button>
        </div>

        <div class="word-count" id="wordCount">
            正在加载单词数据...
        </div>

        <!-- 搜索结果区域 - 现在作为标签页内容 -->
        <div class="search-results-section" id="searchResultsSection" style="display: none;">
            <div class="search-results-info" id="searchResultsInfo"></div>
            <div class="search-results-container" id="searchResultsContainer">
                <!-- 搜索结果将显示在这里 -->
            </div>
        </div>

        <div class="word-container">
            <div class="loading" id="loading">
                🔄 正在加载单词数据，请稍候...
            </div>
            <div class="word-list" id="word-list">
                <!-- 单词将通过AJAX动态加载 -->
            </div>
            
            <div class="pagination" id="pagination">
                <!-- 分页按钮将动态生成 -->
            </div>
        </div>
    </div>

    <!-- 回到顶部按钮 -->
    <button class="back-to-top" id="backToTop" onclick="scrollToTop()" title="回到顶部">
        ↑
    </button>

    <script>
        let currentLevel = 'cet4';
        let currentPage = 1;
        let totalPages = 1;
        let isSearchMode = false;
        let searchData = null; // 保存搜索结果数据

        function showLevel(level) {
            // 如果在搜索模式，先退出搜索模式
            if (isSearchMode) {
                isSearchMode = false;
            }
            
            currentLevel = level;
            currentPage = 1;
            
            // 更新按钮状态 - 修复选择器逻辑
            document.querySelectorAll('.level-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 根据level参数正确设置active状态
            const buttons = document.querySelectorAll('.level-btn');
            buttons.forEach(btn => {
                const onclick = btn.getAttribute('onclick');
                if (onclick && onclick.includes(`'${level}'`)) {
                    btn.classList.add('active');
                }
            });
            
            // 隐藏搜索标签页
            document.getElementById('searchTab').style.display = 'none';
            
            // 显示正常的单词容器，隐藏搜索结果
            document.querySelector('.word-container').style.display = 'block';
            document.getElementById('searchResultsSection').style.display = 'none';
            
            // 加载数据
            loadWords();
        }

        function showSearchResults() {
            // 更新按钮状态
            document.querySelectorAll('.level-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('searchTab').classList.add('active');
            
            // 显示搜索结果，隐藏正常的单词容器
            document.querySelector('.word-container').style.display = 'none';
            document.getElementById('searchResultsSection').style.display = 'block';
            
            // 如果有搜索数据，重新渲染
            if (searchData) {
                const searchContainer = document.getElementById('searchResultsContainer');
                renderSearchResults(searchData.words, searchContainer);
                document.getElementById('searchResultsInfo').textContent = searchData.message;
            }
        }

        function loadWords(page = 1) {
            currentPage = page;
            
            // 获取当前级别名称
            const levelName = currentLevel === 'cet4' ? 'CET-4' : 'CET-6';
            
            // 显示加载状态
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerHTML = `📚 正在加载${levelName}词汇数据...`;
            document.getElementById('word-list').innerHTML = '';
            document.getElementById('pagination').innerHTML = '';
            
            // 第一步：立即加载本地数据
            const localUrl = `/word/api/vocabulary/?level=${currentLevel}&page=${page}&page_size=20&source=local`;
            
            fetch(localUrl)
                .then(response => response.json())
                .then(localData => {
                    // 立即显示本地数据
                    document.getElementById('loading').style.display = 'none';
                    
                    // 重新获取级别名称（确保正确）
                    const currentLevelName = currentLevel === 'cet4' ? 'CET-4' : 'CET-6';
                    document.getElementById('wordCount').textContent = 
                        `当前显示：${currentLevelName} 词汇 第${localData.current_page}页 (本地: ${localData.local_count}个单词) 📚 本地数据`;
                    
                    // 渲染本地单词列表
                    renderWords(localData.words);
                    renderPagination(localData);
                    totalPages = localData.total_pages;
                    
                    // 第二步：异步加载并合并API数据
                    loadAndMergeApiData(page, localData);
                })
                .catch(error => {
                    console.error('本地数据加载失败:', error);
                    const currentLevelName = currentLevel === 'cet4' ? 'CET-4' : 'CET-6';
                    document.getElementById('loading').innerHTML = `❌ ${currentLevelName}数据加载失败，正在重试...`;
                    
                    // 3秒后自动重试
                    setTimeout(() => {
                        loadWords(page);
                    }, 3000);
                });
        }

        // 异步加载并合并API数据 - 不阻塞用户操作
        function loadAndMergeApiData(page, localData) {
            const levelName = currentLevel === 'cet4' ? 'CET-4' : 'CET-6';
            const wordCount = document.getElementById('wordCount');
            
            // 先显示本地数据
            wordCount.textContent = `当前显示：${levelName} 词汇 第${localData.current_page}页 (数据库: ${localData.local_count}个) ✅`;
            
            // 后台异步请求合并数据
            const mergedUrl = `/word/api/vocabulary/?level=${currentLevel}&page=${page}&page_size=20&source=merged`;
            
            fetch(mergedUrl)
                .then(response => response.json())
                .then(mergedData => {
                    const currentLevelName = currentLevel === 'cet4' ? 'CET-4' : 'CET-6';
                    
                    if (mergedData.api_count > 0) {
                        // 有API数据，更新显示
                        wordCount.textContent = 
                            `当前显示：${currentLevelName} 词汇 第${mergedData.current_page}页 (数据库: ${mergedData.local_count} + API: ${mergedData.api_count}) ✅`;
                        renderWords(mergedData.words);
                        renderPagination(mergedData);
                        totalPages = mergedData.total_pages;
                    } else if (mergedData.api_loading) {
                        // API正在加载，3秒后再检查
                        wordCount.textContent = 
                            `当前显示：${currentLevelName} 词汇 第${localData.current_page}页 (数据库: ${localData.local_count}个) ⏳ API加载中...`;
                        setTimeout(() => {
                            checkApiUpdate(page, localData);
                        }, 3000);
                    }
                })
                .catch(error => {
                    console.log('API数据获取失败，使用本地数据');
                });
        }

        // 检查API数据更新
        function checkApiUpdate(page, localData) {
            const mergedUrl = `/word/api/vocabulary/?level=${currentLevel}&page=${page}&page_size=20&source=merged`;
            
            fetch(mergedUrl)
                .then(response => response.json())
                .then(data => {
                    const levelName = currentLevel === 'cet4' ? 'CET-4' : 'CET-6';
                    const wordCount = document.getElementById('wordCount');
                    
                    if (data.api_count > 0) {
                        wordCount.textContent = 
                            `当前显示：${levelName} 词汇 第${data.current_page}页 (数据库: ${data.local_count} + API: ${data.api_count}) ✅`;
                        renderWords(data.words);
                        renderPagination(data);
                        totalPages = data.total_pages;
                    } else {
                        wordCount.textContent = 
                            `当前显示：${levelName} 词汇 第${localData.current_page}页 (数据库: ${localData.local_count}个) ✅`;
                    }
                })
                .catch(error => {
                    console.log('API检查失败');
                });
        }



        // 搜索功能 - 优化版本：精准匹配优先，异步API调用
        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('请输入搜索关键词');
                return;
            }

            const selectedLevel = document.querySelector('input[name="searchLevel"]:checked').value;
            
            // 检查搜索缓存
            const cacheKey = `search_${query}_${selectedLevel}`;
            if (window.searchCache && window.searchCache[cacheKey]) {
                console.log('使用搜索缓存，极速响应...');
                
                // 显示搜索标签页
                document.getElementById('searchTab').style.display = 'inline-block';
                showSearchResults();
                
                const cachedData = window.searchCache[cacheKey];
                searchData = cachedData;
                
                // 立即显示缓存结果
                const searchInfo = document.getElementById('searchResultsInfo');
                searchInfo.textContent = cachedData.message + ' ⚡ 缓存数据';
                
                const searchContainer = document.getElementById('searchResultsContainer');
                renderSearchResults(cachedData.words, searchContainer);
                
                document.querySelector('.clear-search-btn').style.display = 'inline-block';
                isSearchMode = true;
                
                // 后台异步更新搜索结果
                updateSearchInBackground(query, selectedLevel, cacheKey);
                return;
            }
            
            // 显示搜索标签页
            document.getElementById('searchTab').style.display = 'inline-block';
            
            // 切换到搜索结果标签页
            showSearchResults();
            
            // 显示加载状态 - 优化的搜索提示
            const searchContainer = document.getElementById('searchResultsContainer');
            const searchInfo = document.getElementById('searchResultsInfo');
            
            searchInfo.textContent = '🎯 智能搜索引擎启动中...';
            searchContainer.innerHTML = `
                <div class="loading">
                    <div style="text-align: center; padding: 20px;">
                        <div style="font-size: 1.2em; margin-bottom: 10px;">🔍 精准匹配优先搜索</div>
                        <div style="color: #666; font-size: 0.9em;">
                            第一步：本地词库精准匹配 → 第二步：异步API补充搜索
                        </div>
                        <div style="margin-top: 15px; padding: 10px; background: #e8f5e8; border-radius: 8px; color: #2E7D32;">
                            💡 搜索策略：如果本地精准匹配成功，立即返回结果；否则异步调用API补充
                        </div>
                    </div>
                </div>
            `;
            
            // 发送优化的搜索请求
            const url = `/word/api/search/?q=${encodeURIComponent(query)}&level=${selectedLevel}`;
            
            const startTime = Date.now();
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const responseTime = Date.now() - startTime;
                    
                    // 缓存搜索结果
                    if (!window.searchCache) {
                        window.searchCache = {};
                    }
                    window.searchCache[cacheKey] = data;
                    
                    // 保存搜索数据
                    searchData = data;
                    
                    // 更新搜索结果信息，包含响应时间
                    let timeInfo = '';
                    if (data.search_time === 'instant') {
                        timeInfo = ' ⚡ 瞬时响应';
                    } else if (data.search_time === 'fast') {
                        timeInfo = ' 🚀 快速响应';
                    } else if (data.search_time === 'extended') {
                        timeInfo = ' 🔍 深度搜索';
                    } else if (data.search_time === 'timeout') {
                        timeInfo = ' ⏱️ 本地优先';
                    } else if (data.search_time === 'local_only') {
                        timeInfo = ' 📚 本地搜索';
                    }
                    
                    searchInfo.textContent = data.message + timeInfo + ` (${responseTime}ms)`;
                    
                    // 渲染搜索结果
                    renderSearchResults(data.words, searchContainer);
                    
                    // 显示清除搜索按钮
                    document.querySelector('.clear-search-btn').style.display = 'inline-block';
                    
                    // 设置搜索模式
                    isSearchMode = true;
                    
                    // 记录搜索性能
                    console.log(`搜索完成: ${query}, 响应时间: ${responseTime}ms, 结果数: ${data.words.length}, 策略: ${data.search_time}`);
                })
                .catch(error => {
                    console.error('搜索失败:', error);
                    searchInfo.textContent = '❌ 搜索服务暂时不可用';
                    searchContainer.innerHTML = `
                        <div class="loading">
                            <div style="text-align: center; padding: 20px; color: #f44336;">
                                <div style="font-size: 1.2em; margin-bottom: 10px;">❌ 搜索失败</div>
                                <div style="color: #666; font-size: 0.9em; margin-bottom: 15px;">
                                    网络连接异常或服务器暂时不可用
                                </div>
                                <button onclick="performSearch()" style="padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
                                    🔄 重试搜索
                                </button>
                            </div>
                        </div>
                    `;
                });
        }

        // 快速单词查询功能（新增）
        function quickWordLookup(word) {
            return new Promise((resolve, reject) => {
                const url = `/word/api/quick-lookup/?word=${encodeURIComponent(word)}`;
                
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            resolve(data);
                        } else {
                            reject(new Error(data.message));
                        }
                    })
                    .catch(error => {
                        reject(error);
                    });
            });
        }

        // 后台更新搜索结果 - 优化版本
        function updateSearchInBackground(query, selectedLevel, cacheKey) {
            const url = `/word/api/search/?q=${encodeURIComponent(query)}&level=${selectedLevel}`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    // 静默更新搜索缓存
                    if (!window.searchCache) {
                        window.searchCache = {};
                    }
                    
                    // 检查是否有新的结果
                    const oldData = window.searchCache[cacheKey];
                    const hasNewResults = !oldData || oldData.words.length !== data.words.length;
                    
                    window.searchCache[cacheKey] = data;
                    
                    console.log('后台搜索数据更新完成', hasNewResults ? '(有新结果)' : '(无变化)');
                    
                    // 如果有新结果且用户仍在查看搜索结果，提示更新
                    if (hasNewResults && isSearchMode) {
                        setTimeout(() => {
                            const searchInfo = document.getElementById('searchResultsInfo');
                            if (searchInfo && searchInfo.textContent.includes('缓存数据')) {
                                searchInfo.textContent = data.message + ' 🔄 已更新';
                                
                                // 可选：自动刷新搜索结果
                                const searchContainer = document.getElementById('searchResultsContainer');
                                if (searchContainer) {
                                    renderSearchResults(data.words, searchContainer);
                                    searchData = data;
                                }
                            }
                        }, 1000);
                    }
                })
                .catch(error => {
                    console.log('后台搜索更新失败，继续使用缓存数据:', error);
                });
        }

        // 渲染搜索结果
        function renderSearchResults(words, container) {
            container.innerHTML = '';
            
            if (words.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 2rem; color: #666;">没有找到匹配的单词</div>';
                return;
            }
            
            words.forEach((word, index) => {
                const wordCard = document.createElement('div');
                wordCard.className = 'word-card';
                
                // 添加序号
                const numberDisplay = `<span class="word-number">#${index + 1}</span>`;
                
                wordCard.innerHTML = `
                    <div class="word-header">
                        <div class="word-title">
                            ${numberDisplay}
                            <span class="word">${word.word}</span>
                        </div>
                        <span class="level-badge">${word.level}</span>
                    </div>
                    <div class="translation">${word.translation}</div>
                    <div class="meaning">${word.meaning}</div>
                `;
                
                // 添加点击事件
                wordCard.addEventListener('click', function() {
                    console.log('点击了单词：' + word.word);
                    this.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 150);
                });
                
                container.appendChild(wordCard);
            });
        }

        // 清除搜索
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.querySelector('.clear-search-btn').style.display = 'none';
            
            // 隐藏搜索标签页
            document.getElementById('searchTab').style.display = 'none';
            
            // 重置搜索模式和数据
            isSearchMode = false;
            searchData = null;
            
            // 切换回CET-4标签页
            showLevel('cet4');
        }

        function renderWords(words) {
            const wordList = document.getElementById('word-list');
            wordList.innerHTML = '';
            
            if (words.length === 0) {
                wordList.innerHTML = '<div style="text-align: center; padding: 2rem; color: #666;">没有找到匹配的单词</div>';
                return;
            }
            
            words.forEach(word => {
                const wordCard = document.createElement('div');
                wordCard.className = 'word-card';
                
                // 根据数据来源添加不同的样式标识
                const sourceIcon = word.source === 'api' ? '🌐' : '📚';
                const sourceTitle = word.source === 'api' ? 'API数据' : '本地数据';
                
                wordCard.innerHTML = `
                    <div class="word-header">
                        <span class="word">${word.word}</span>
                        <div class="word-badges">
                            <span class="level-badge">${word.level}</span>
                            <span class="source-badge" title="${sourceTitle}">${sourceIcon}</span>
                        </div>
                    </div>
                    <div class="translation">${word.translation}</div>
                    <div class="meaning">${word.meaning}</div>
                `;
                
                // 为API数据添加特殊样式
                if (word.source === 'api') {
                    wordCard.style.borderLeft = '3px solid #2196F3';
                    wordCard.style.background = 'linear-gradient(135deg, #f8f9ff, #ffffff)';
                }
                
                // 添加点击事件
                wordCard.addEventListener('click', function() {
                    console.log('点击了单词：' + word.word + ' (来源: ' + (word.source || 'local') + ')');
                    this.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 150);
                });
                
                wordList.appendChild(wordCard);
            });
        }

        function renderPagination(data) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            // 上一页按钮
            const prevBtn = document.createElement('button');
            prevBtn.textContent = '上一页';
            prevBtn.disabled = !data.has_prev;
            prevBtn.onclick = () => loadWords(currentPage - 1);
            pagination.appendChild(prevBtn);
            
            // 页码信息
            const pageInfo = document.createElement('span');
            pageInfo.className = 'page-info';
            pageInfo.textContent = `第 ${data.current_page} 页 / 共 ${data.total_pages} 页`;
            pagination.appendChild(pageInfo);
            
            // 下一页按钮
            const nextBtn = document.createElement('button');
            nextBtn.textContent = '下一页';
            nextBtn.disabled = !data.has_next;
            nextBtn.onclick = () => loadWords(currentPage + 1);
            pagination.appendChild(nextBtn);
            
            // 跳转到页面
            const jumpInput = document.createElement('input');
            jumpInput.type = 'number';
            jumpInput.min = 1;
            jumpInput.max = data.total_pages;
            jumpInput.placeholder = '页码';
            jumpInput.style.cssText = 'width: 60px; margin: 0 10px; padding: 5px; border: 1px solid #ddd; border-radius: 3px;';
            
            const jumpBtn = document.createElement('button');
            jumpBtn.textContent = '跳转';
            jumpBtn.onclick = () => {
                const page = parseInt(jumpInput.value);
                if (page >= 1 && page <= data.total_pages) {
                    loadWords(page);
                }
            };
            
            pagination.appendChild(jumpInput);
            pagination.appendChild(jumpBtn);
        }

        function refreshData() {
            if (isSearchMode) {
                performSearch();
            } else {
                loadWords(currentPage);
            }
        }

        // 页面加载完成后自动加载第一页数据
        document.addEventListener('DOMContentLoaded', function() {
            // 立即开始异步预加载数据
            preloadData();
            
            // 搜索框回车事件
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
        });

        // 异步预加载数据函数
        function preloadData() {
            console.log('开始异步预加载数据...');
            
            // 更新状态栏为加载状态
            const apiStatus = document.getElementById('apiStatus');
            apiStatus.className = 'api-status loading';
            apiStatus.innerHTML = '🚀 正在后台预加载CET-4/CET-6词汇数据... 0%';
            
            // 显示友好的加载提示
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerHTML = '⚡ 智能预加载中，即将为您呈现海量词汇...';
            
            // 更新单词计数区域
            const wordCount = document.getElementById('wordCount');
            wordCount.textContent = '🔄 正在异步加载词汇引擎...';
            
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += 10;
                if (progress <= 90) {
                    apiStatus.innerHTML = `🚀 正在后台预加载CET-4/CET-6词汇数据... ${progress}%`;
                }
            }, 200);
            
            // 异步预加载CET-4和CET-6数据
            Promise.all([
                preloadLevelData('cet4'),
                preloadLevelData('cet6')
            ]).then(results => {
                clearInterval(progressInterval);
                console.log('预加载完成:', results);
                
                // 计算总词汇量
                const totalWords = results.reduce((sum, result) => sum + result.total, 0);
                
                // 更新状态为就绪
                apiStatus.className = 'api-status ready';
                apiStatus.innerHTML = `📚 联合搜索引擎已就绪 | 数据库词库: CET-4(${results[0].total}词) + CET-6(${results[1].total}词) | 外部API词库: 异步扩展中 | ⚡ 智能模式`;
                
                // 预加载完成后，立即显示第一页数据
                loadWords(1);
                
                // 显示成功提示
                setTimeout(() => {
                    const wordCount = document.getElementById('wordCount');
                    wordCount.textContent = '✅ 数据预加载完成，享受极速体验！';
                }, 500);
                
            }).catch(error => {
                clearInterval(progressInterval);
                console.error('预加载失败:', error);
                
                // 更新状态为降级模式
                apiStatus.className = 'api-status';
                apiStatus.innerHTML = '📚 词汇引擎启动 | 🔄 降级到实时加载模式';
                
                // 即使预加载失败，也要显示数据
                loadWords(1);
            });
        }

        // 预加载指定级别的数据
        function preloadLevelData(level) {
            return new Promise((resolve, reject) => {
                const url = `/word/api/vocabulary/?level=${level}&page=1&page_size=20`;
                
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        console.log(`${level.toUpperCase()} 数据预加载完成:`, data.total_words, '个单词');
                        
                        // 缓存完整数据
                        if (!window.cachedWordsData) {
                            window.cachedWordsData = {};
                        }
                        window.cachedWordsData[level] = data;
                        
                        resolve({
                            level: level,
                            total: data.total_words,
                            status: 'success'
                        });
                    })
                    .catch(error => {
                        console.error(`${level.toUpperCase()} 预加载失败:`, error);
                        resolve({
                            level: level,
                            total: 0,
                            status: 'failed'
                        });
                    });
            });
        }

        // 智能缓存管理
        function manageCacheSize() {
            // 限制搜索缓存大小，防止内存占用过多
            if (window.searchCache && Object.keys(window.searchCache).length > 50) {
                console.log('清理搜索缓存...');
                // 保留最近的20个搜索结果
                const keys = Object.keys(window.searchCache);
                const keysToDelete = keys.slice(0, keys.length - 20);
                keysToDelete.forEach(key => {
                    delete window.searchCache[key];
                });
            }
        }

        // 定期清理缓存
        setInterval(manageCacheSize, 60000); // 每分钟检查一次

        // 回到顶部功能
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // 监听滚动事件，控制回到顶部按钮的显示
        window.addEventListener('scroll', function() {
            const backToTopBtn = document.getElementById('backToTop');
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            if (scrollTop > 300) {
                backToTopBtn.classList.add('show');
            } else {
                backToTopBtn.classList.remove('show');
            }
        });

        // 添加CSS动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            
            .word-card {
                animation: fadeIn 0.3s ease;
            }
            
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }

            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.1); }
                100% { transform: scale(1); }
            }

            .back-to-top:hover {
                animation: pulse 0.6s ease-in-out;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
