<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}英语学习平台{% endblock %}</title>
    
    <!-- 默认favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" type="image/svg+xml">
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" type="image/svg+xml">
    
    {% block extra_css %}{% endblock %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 导航栏 */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            box-shadow: 0 4px 30px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 70px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo::before {
            content: "📚";
            font-size: 2rem;
            -webkit-text-fill-color: initial;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 0;
            align-items: center;
            flex-wrap: nowrap;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 50px;
            padding: 0.3rem;
            box-shadow: 
                0 4px 20px rgba(0,0,0,0.1),
                inset 0 1px 0 rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .nav-menu li {
            margin: 0;
            position: relative;
        }

        .nav-menu li:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 60%;
            background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.1), transparent);
        }

        .nav-link {
            text-decoration: none;
            color: #555;
            font-weight: 600;
            padding: 0.8rem 1.2rem;
            border-radius: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: visible;
            white-space: nowrap;
            min-width: fit-content;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
        }

        .nav-link:hover {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .nav-link.active {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 3px 10px rgba(76, 175, 80, 0.3);
        }



        /* 移动端导航 */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #555;
            padding: 0.5rem;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .mobile-menu-btn:hover {
            background: rgba(0,0,0,0.1);
        }

        .mobile-menu-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            .mobile-menu-btn {
                display: block;
                z-index: 1002;
                position: relative;
            }

            .nav-menu {
                position: absolute;
                top: 100%;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(255, 255, 255, 0.98);
                backdrop-filter: blur(15px);
                flex-direction: column;
                gap: 0;
                padding: 1rem;
                box-shadow: 0 4px 20px rgba(0,0,0,0.2);
                border-radius: 20px;
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition: all 0.3s ease;
                width: 90%;
                max-width: 300px;
                z-index: 1003;
            }

            .nav-menu.active {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
            }

            .nav-menu li::after {
                display: none;
            }

            .nav-link {
                width: 100%;
                text-align: center;
                padding: 1rem;
                border-radius: 10px;
                margin: 0.2rem 0;
                white-space: nowrap;
                overflow: visible;
                justify-content: center;
            }

            .nav-container {
                padding: 1rem 2rem;
                position: relative;
            }
            
            /* 确保导航栏在所有内容之上 */
            .navbar {
                z-index: 1001;
                position: sticky;
            }
        }

        /* 确保导航文字在小屏幕上也能完整显示 */
        @media (max-width: 1024px) and (min-width: 769px) {
            .nav-link {
                padding: 0.8rem 1.2rem;
                font-size: 0.95rem;
            }
        }

        /* 主要内容区域 */
        .main-content {
            padding: 2rem 0;
        }

        /* 卡片样式 */
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        /* 按钮样式 */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-secondary {
            background: #2196F3;
        }

        .btn-secondary:hover {
            background: #1976D2;
        }

        /* 页脚 */
        .footer {
            background: rgba(0,0,0,0.8);
            color: white;
            text-align: center;
            padding: 2rem 0;
            margin-top: 3rem;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-menu {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .container {
                padding: 0 15px;
            }
        }

        /* 回到顶部按钮 */
        .global-back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4);
            transition: all 0.3s ease;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            z-index: 1001;
        }

        .global-back-to-top.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .global-back-to-top:hover {
            background: linear-gradient(135deg, #45a049, #4CAF50);
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.6);
        }

        .global-back-to-top:active {
            transform: translateY(-2px) scale(1.05);
        }

        @media (max-width: 768px) {
            .global-back-to-top {
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
        }

    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{% url 'home' %}" class="logo">英语学习平台</a>
            
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
            
            <ul class="nav-menu" id="navMenu">
                <li><a href="{% url 'home' %}" class="nav-link">🏠 主页</a></li>
                <li><a href="{% url 'vocabulary' %}" class="nav-link">📚 单词本</a></li>
                <li><a href="{% url 'ai_chat' %}" class="nav-link">🤖 AI助手</a></li>
                <li><a href="{% url 'demo' %}" class="nav-link">🎮 功能演示</a></li>
                <li><a href="{% url 'about' %}" class="nav-link">ℹ️ 关于我们</a></li>
                <li><a href="{% url 'contact' %}" class="nav-link">📞 联系我们</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 英语学习平台. 专注于英语四六级词汇学习.</p>
            <p style="margin-top: 0.5rem; font-size: 0.9rem; opacity: 0.8;">
                📧 jiyin004@gmail.com | 📱 +86 130 2322 9967 | 📍 上海市松江区文汇路1000弄
            </p>
        </div>
    </footer>

    <!-- 全局回到顶部按钮 -->
    <button class="global-back-to-top" id="globalBackToTop" onclick="scrollToTop()" title="回到顶部">
        ↑
    </button>

    <script>
        // 移动端菜单切换
        function toggleMobileMenu() {
            console.log('toggleMobileMenu called');
            const navMenu = document.getElementById('navMenu');
            if (navMenu) {
                navMenu.classList.toggle('active');
                console.log('Menu toggled, active:', navMenu.classList.contains('active'));
            } else {
                console.log('navMenu not found');
            }
        }

        // 全局回到顶部功能
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // 高亮当前页面的导航链接
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Base template loaded');
            
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');
            
            navLinks.forEach(link => {
                const linkPath = link.getAttribute('href');
                if (linkPath === currentPath || (currentPath.includes(linkPath) && linkPath !== '/app01/')) {
                    link.classList.add('active');
                }
            });

            // 点击导航链接时关闭移动端菜单
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    const navMenu = document.getElementById('navMenu');
                    if (navMenu) {
                        navMenu.classList.remove('active');
                    }
                });
            });

            // 点击页面其他地方时关闭移动端菜单
            document.addEventListener('click', function(e) {
                const navMenu = document.getElementById('navMenu');
                const mobileBtn = document.querySelector('.mobile-menu-btn');
                
                if (navMenu && mobileBtn && !navMenu.contains(e.target) && !mobileBtn.contains(e.target)) {
                    navMenu.classList.remove('active');
                }
            });

            // 监听滚动事件，控制全局回到顶部按钮的显示
            window.addEventListener('scroll', function() {
                const backToTopBtn = document.getElementById('globalBackToTop');
                if (backToTopBtn) {
                    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                    
                    if (scrollTop > 400) {
                        backToTopBtn.classList.add('show');
                    } else {
                        backToTopBtn.classList.remove('show');
                    }
                }
            });
            
            // 移动端导航
            const mobileBtn = document.querySelector('.mobile-menu-btn');
            const navMenu = document.getElementById('navMenu');
            
            if (mobileBtn && navMenu) {
                console.log('Mobile navigation elements found');
            }
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
